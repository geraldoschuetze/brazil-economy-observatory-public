<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="1280" height="980" role="img" aria-label="Architecture across three environments. The same public APIs — BACEN, CVM and IBGE — are ingested by the same six Airflow DAGs in DEV, QA and PROD, each into its own PostgreSQL. Promotion is sequential: the developer machine pushes to GitHub Actions, which lints and validates DAG imports, then deploys over SSH to QA on the develop branch; once validated on QA, develop is merged into main and PROD is deployed. QA and PROD sit side by side on one Oracle Cloud Always Free ARM VM. Inside PROD, Airflow writes raw data to PostgreSQL, dbt builds and tests staging and marts, Superset serves the public dashboard and OpenMetadata holds the catalog and column-level lineage, all reached through an outbound Cloudflare Tunnel by visitors who never log in.">
