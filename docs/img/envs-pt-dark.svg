<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="1280" height="980" role="img" aria-label="Arquitetura em três ambientes. As mesmas APIs públicas — BACEN, CVM e IBGE — são ingeridas pelas mesmas seis DAGs do Airflow em DEV, QA e PROD, cada um no seu próprio PostgreSQL. A promoção é sequencial: a máquina do desenvolvedor faz push para o GitHub Actions, que roda lint e valida o import das DAGs, e então faz deploy por SSH para o QA na branch develop; validado no QA, a develop entra na main e o PROD é publicado. QA e PROD ficam lado a lado numa única VM ARM Always Free da Oracle Cloud. Dentro do PROD, o Airflow grava os dados raw no PostgreSQL, o dbt constrói e testa staging e marts, o Superset serve o dashboard público e o OpenMetadata guarda o catálogo e a linhagem coluna a coluna, tudo alcançado por um Cloudflare Tunnel de saída por visitantes que nunca fazem login.">
