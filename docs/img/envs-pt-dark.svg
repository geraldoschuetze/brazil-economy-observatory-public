<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-label="Arquitetura em três ambientes. A máquina do desenvolvedor roda a stack em Docker Compose e faz push para o GitHub Actions, que roda lint, valida o import das DAGs e faz deploy por SSH para o QA na branch develop e o PROD na main, ambos numa única VM ARM Always Free da Oracle Cloud. Dentro do PROD, o Airflow ingere as APIs públicas de BACEN, CVM e IBGE no PostgreSQL, o dbt constrói e testa staging e marts, o Superset serve o dashboard público e o OpenMetadata cataloga a linhagem — tudo alcançado pelo visitante através de um Cloudflare Tunnel de saída.">
